<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="dist/style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300..700&display=swap"
      rel="stylesheet" />
    <title>Fisheye - photographe</title>
    <script src="dist/photographerPage.js" type="module" defer></script>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img
          src="assets/images/logo.png"
          class="logo"
          alt="Fisheye - Accueil"
      /></a>
    </header>
    <main id="main">
      <div class="photographer_banner"></div>
      <div class="photographer_filter"></div>
      <div class="photographer_gallery"></div>
      <div class="photographer_infos"></div>
    </main>
    <div
      class="photographer_modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal_title"
      hidden></div>
    <div
      class="photographer_lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Visionneuse de médias"
      hidden></div>
  </body>
</html>
